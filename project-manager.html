<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 관리 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }

        .nav-tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f8f9fa;
            border: none;
            font-size: 1.1em;
            font-weight: 600;
            color: #495057;
            transition: all 0.3s;
        }

        .nav-tab:hover {
            background: #e9ecef;
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .content {
            padding: 30px;
            min-height: 500px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .project-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            cursor: pointer;
            transition: all 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .project-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .project-card p {
            color: #6c757d;
            font-size: 0.9em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th,
        table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }

        table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        table tr:hover {
            background: #f8f9fa;
        }

        .file-upload {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            background: #f8f9fa;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .report-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .report-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .info-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-item label {
            display: block;
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .chatbot-link {
            display: block;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-decoration: none;
            color: #667eea;
            font-size: 1.2em;
            text-align: center;
            margin-top: 20px;
            border: 2px solid #667eea;
            transition: all 0.3s;
        }

        .chatbot-link:hover {
            background: #667eea;
            color: white;
        }

        .task-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .task-item h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .task-item p {
            color: #6c757d;
            font-size: 0.9em;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #dee2e6;
        }

        .modal-header h3 {
            color: #667eea;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #6c757d;
        }

        .close-btn:hover {
            color: #333;
        }

        /* 액션 버튼 컨테이너 */
        .action-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: white;
            border: 2px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #667eea;
            transition: all 0.3s;
        }

        .icon-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        /* 타일 그리드 */
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tile {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .tile h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .tile p {
            color: #6c757d;
            font-size: 0.9em;
            margin: 5px 0;
        }

        /* 챗봇 타일 */
        .chatbot-tile {
            text-decoration: none;
            display: block;
        }

        .chatbot-tile:hover h4 {
            color: #764ba2;
        }

        /* Task 타일 */
        .task-tile {
            position: relative;
        }

        .task-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-ongoing {
            background: #d4edda;
            color: #155724;
        }

        .status-complete {
            background: #cce5ff;
            color: #004085;
        }

        .status-hold {
            background: #fff3cd;
            color: #856404;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        /* 필터 버튼 */
        .filter-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        /* 섹션 제목 */
        .section-title {
            font-size: 1.3em;
            color: #333;
            margin: 30px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
        }

        /* 상대 위치 컨테이너 */
        .relative-container {
            position: relative;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 프로젝트 관리 시스템</h1>
            <p>프로젝트 리포트 및 협업 관리</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('report')">📝 리포트 작성</button>
            <button class="nav-tab" onclick="showTab('projects')">📂 프로젝트 목록</button>
            <button class="nav-tab" onclick="showTab('chatbot')">💬 챗봇 URL</button>
            <button class="nav-tab" onclick="showTab('tasks')">✅ Task 공유</button>
        </div>

        <div class="content">
            <!-- 리포트 작성 탭 -->
            <div id="report" class="tab-content active">
                <h2>📝 프로젝트 리포트 작성</h2>
                
                <div class="form-group">
                    <label>프로젝트 선택/입력</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="projectSelect" style="flex: 1;" onchange="loadProjectData()">
                            <option value="">새 프로젝트 생성</option>
                        </select>
                        <input type="text" id="newProjectName" placeholder="또는 새 프로젝트 이름 입력" style="flex: 1;">
                    </div>
                </div>

                <div class="report-section">
                    <h3>프로젝트 개요</h3>
                    <div class="row">
                        <div class="form-group">
                            <label>프로젝트 이름</label>
                            <input type="text" id="projectName" placeholder="예: 스마트폰 A 개발">
                        </div>
                        <div class="form-group">
                            <label>CPU</label>
                            <input type="text" id="cpu" placeholder="예: Snapdragon 8 Gen 3">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>RAM</label>
                            <input type="text" id="ram" placeholder="예: 8GB LPDDR5">
                        </div>
                        <div class="form-group">
                            <label>출시지역</label>
                            <input type="text" id="region" placeholder="예: 한국, 미국, 유럽">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>일정 단계</label>
                        <select id="stage">
                            <option value="1">1단계 - 기획</option>
                            <option value="2">2단계 - 개발</option>
                            <option value="3">3단계 - 테스트</option>
                            <option value="4">4단계 - 출시</option>
                        </select>
                    </div>
                </div>

                <div class="report-section">
                    <h3>제품 이슈 현황 (엑셀/CSV 업로드)</h3>
                    <div class="file-upload" onclick="document.getElementById('issueFile').click()">
                        <input type="file" id="issueFile" accept=".xlsx,.xls,.csv" onchange="handleFileUpload(event)">
                        <p style="font-size: 1.2em; color: #667eea; margin-bottom: 10px;">📁 클릭하여 파일 선택</p>
                        <p style="color: #6c757d;">Excel 또는 CSV 파일을 업로드하세요</p>
                        <p style="font-size: 0.9em; color: #6c757d; margin-top: 10px;">필수 컬럼: Project, Status, Priority, Frequency, Reproducible</p>
                    </div>
                    <div id="issueAnalysisResult"></div>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn btn-primary" onclick="saveReport()">💾 리포트 저장</button>
                    <button class="btn btn-secondary" onclick="generateReport()">📄 리포트 보기</button>
                </div>

                <div id="reportPreview" style="margin-top: 30px;"></div>
            </div>

            <!-- 프로젝트 목록 탭 -->
            <div id="projects" class="tab-content">
                <h2>📂 프로젝트 목록</h2>
                <div id="projectList" class="project-grid"></div>
            </div>

            <!-- 챗봇 URL 탭 -->
            <div id="chatbot" class="tab-content">
                <div class="relative-container">
                    <h2>💬 챗봇 URL 관리</h2>
                    <div class="action-buttons">
                        <button class="icon-btn" onclick="showChatbotModal()" title="챗봇 추가">+</button>
                        <button class="icon-btn" onclick="showSettingsModal()" title="설정">⚙️</button>
                    </div>
                    <div id="chatbotList" class="tile-grid"></div>
                </div>
            </div>

            <!-- Task 공유 탭 -->
            <div id="tasks" class="tab-content">
                <div class="relative-container">
                    <h2>✅ Task 공유</h2>
                    <div class="action-buttons">
                        <button class="icon-btn" onclick="showTaskModal()" title="Task 추가">+</button>
                        <button class="icon-btn" onclick="toggleTaskFilter()" title="필터">🔍</button>
                    </div>
                    
                    <div id="taskFilterGroup" class="filter-group" style="display: none;">
                        <button class="filter-btn active" onclick="filterTasks('all')">전체</button>
                        <button class="filter-btn" onclick="filterTasks('ongoing')">진행중</button>
                        <button class="filter-btn" onclick="filterTasks('hold')">보류</button>
                    </div>
                    
                    <div id="taskListOngoing"></div>
                    
                    <div class="section-title" id="completedSection" style="display: none;">완료된 Task</div>
                    <div id="taskListComplete"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ 설정</h3>
                <button class="close-btn" onclick="closeSettingsModal()">×</button>
            </div>
            <div class="form-group">
                <label>파일 저장 경로</label>
                <input type="text" id="settingSavePath" placeholder="예: C:\FILES">
                <p style="font-size: 0.85em; color: #6c757d; margin-top: 5px;">
                    💡 공용 폴더 경로를 입력하세요. (예: C:\SharedFolder)
                </p>
            </div>
            <div style="text-align: right;">
                <button class="btn btn-secondary" onclick="closeSettingsModal()">취소</button>
                <button class="btn btn-primary" onclick="saveSettings()">저장</button>
            </div>
        </div>
    </div>

    <!-- 챗봇 추가 모달 -->
    <div id="chatbotModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>💬 챗봇 추가</h3>
                <button class="close-btn" onclick="closeChatbotModal()">×</button>
            </div>
            <div class="form-group">
                <label>챗봇 이름</label>
                <input type="text" id="chatbotName" placeholder="예: 팀 업무 챗봇">
            </div>
            <div class="form-group">
                <label>챗봇 URL</label>
                <input type="text" id="chatbotUrl" placeholder="https://...">
            </div>
            <div style="text-align: right;">
                <button class="btn btn-secondary" onclick="closeChatbotModal()">취소</button>
                <button class="btn btn-primary" onclick="saveChatbot()">저장</button>
            </div>
        </div>
    </div>

    <!-- Task 추가/수정 모달 -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="taskModalTitle">✅ Task 추가</h3>
                <button class="close-btn" onclick="closeTaskModal()">×</button>
            </div>
            <div class="form-group">
                <label>제목</label>
                <input type="text" id="taskTitle" placeholder="예: UI 디자인 검토">
            </div>
            <div class="form-group">
                <label>담당자</label>
                <input type="text" id="taskAssignee" placeholder="예: 홍길동">
            </div>
            <div class="form-group">
                <label>목표일</label>
                <input type="date" id="taskDueDate">
            </div>
            <div class="form-group">
                <label>상태</label>
                <select id="taskStatus">
                    <option value="ongoing">진행중 (Ongoing)</option>
                    <option value="complete">완료 (Complete)</option>
                    <option value="hold">보류 (Hold)</option>
                </select>
            </div>
            <div class="form-group">
                <label>진행상황 (%)</label>
                <input type="number" id="taskProgress" min="0" max="100" value="0" placeholder="0-100">
            </div>
            <input type="hidden" id="taskId">
            <div style="text-align: right;">
                <button class="btn btn-secondary" onclick="closeTaskModal()">취소</button>
                <button class="btn btn-primary" onclick="saveTask()">저장</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // 로컬 스토리지 키
        const STORAGE_KEYS = {
            PROJECTS: 'pm_projects',
            CHATBOTS: 'pm_chatbots',
            TASKS: 'pm_tasks',
            SETTINGS: 'pm_settings'
        };

        // 전역 변수
        let currentIssueData = null;

        // 페이지 로드 시 초기화
        window.onload = function() {
            checkInitialSettings();
            loadProjects();
            loadChatbots();
            loadTasks();
            updateProjectSelect();
        };

        // 초기 설정 확인
        function checkInitialSettings() {
            const settings = getSettings();
            if (!settings.savePath) {
                showSettingsModal();
            }
        }

        // 설정 가져오기
        function getSettings() {
            const data = localStorage.getItem(STORAGE_KEYS.SETTINGS);
            return data ? JSON.parse(data) : { savePath: '' };
        }

        // 설정 저장
        function saveSettings() {
            const savePath = document.getElementById('settingSavePath').value.trim();
            if (!savePath) {
                showAlert('저장 경로를 입력해주세요.', 'danger');
                return;
            }
            localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify({ savePath }));
            showAlert('설정이 저장되었습니다!', 'success');
            closeSettingsModal();
        }

        // 설정 모달 표시
        function showSettingsModal() {
            document.getElementById('settingsModal').style.display = 'flex';
            const settings = getSettings();
            document.getElementById('settingSavePath').value = settings.savePath || '';
        }

        // 설정 모달 닫기
        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        // 탭 전환
        function showTab(tabName) {
            // 모든 탭 콘텐츠 숨기기
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 모든 탭 버튼 비활성화
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 선택한 탭 활성화
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // 프로젝트 목록 탭이면 리스트 갱신
            if (tabName === 'projects') {
                loadProjects();
            }
        }

        // 엑셀/CSV 파일 업로드 처리
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    
                    currentIssueData = jsonData;
                    analyzeIssues(jsonData);
                } catch (error) {
                    showAlert('파일 읽기 오류: ' + error.message, 'danger');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 이슈 데이터 분석
        function analyzeIssues(data) {
            if (!data || data.length === 0) {
                showAlert('파일에 데이터가 없습니다.', 'danger');
                return;
            }

            // 프로젝트별로 그룹화
            const projectGroups = {};
            
            data.forEach(row => {
                const project = row.Project || row.project || '미분류';
                const status = (row.Status || row.status || '').toUpperCase();
                const priority = row.Priority || row.priority || '';
                const frequency = row.Frequency || row.frequency || '';
                const reproducible = row.Reproducible || row.reproducible || '';

                if (!projectGroups[project]) {
                    projectGroups[project] = {
                        total: 0,
                        open: 0,
                        resolve: 0,
                        close: 0,
                        priorityAAlways: 0,
                        reproducibleY: 0
                    };
                }

                projectGroups[project].total++;
                
                if (status.includes('OPEN')) projectGroups[project].open++;
                else if (status.includes('RESOLVE')) projectGroups[project].resolve++;
                else if (status.includes('CLOSE')) projectGroups[project].close++;

                if (priority === 'A' && frequency === 'Always') {
                    projectGroups[project].priorityAAlways++;
                }

                if (reproducible === 'Y') {
                    projectGroups[project].reproducibleY++;
                }
            });

            displayIssueAnalysis(projectGroups);
        }

        // 이슈 분석 결과 표시
        function displayIssueAnalysis(projectGroups) {
            const stage = document.getElementById('stage').value;
            
            let html = '<table>';
            html += '<thead><tr>';
            html += '<th>Project</th><th>Total</th><th>Active</th><th>Open</th><th>Resolve</th><th>Close</th>';
            
            if (stage === '1') {
                html += '<th>해결률</th><th>중요도A+Always</th><th>재현가능Y</th>';
            }
            
            html += '</tr></thead><tbody>';

            for (const [project, stats] of Object.entries(projectGroups)) {
                const active = stats.open + stats.resolve;
                const resolveRate = stats.total > 0 ? ((stats.close / stats.total) * 100).toFixed(1) : '0';
                
                html += '<tr>';
                html += `<td><strong>${project}</strong></td>`;
                html += `<td>${stats.total}</td>`;
                html += `<td>${active}</td>`;
                html += `<td>${stats.open}</td>`;
                html += `<td>${stats.resolve}</td>`;
                html += `<td>${stats.close}</td>`;
                
                if (stage === '1') {
                    html += `<td>${resolveRate}%</td>`;
                    html += `<td>${stats.priorityAAlways}</td>`;
                    html += `<td>${stats.reproducibleY}</td>`;
                }
                
                html += '</tr>';
            }

            html += '</tbody></table>';
            document.getElementById('issueAnalysisResult').innerHTML = html;
        }

        // 리포트 저장
        function saveReport() {
            const projectName = document.getElementById('newProjectName').value.trim() || 
                               document.getElementById('projectName').value.trim();
            
            if (!projectName) {
                showAlert('프로젝트 이름을 입력해주세요.', 'danger');
                return;
            }

            const reportData = {
                id: Date.now(),
                projectName: projectName,
                cpu: document.getElementById('cpu').value,
                ram: document.getElementById('ram').value,
                region: document.getElementById('region').value,
                stage: document.getElementById('stage').value,
                issueData: currentIssueData,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            const projects = getProjects();
            const existingIndex = projects.findIndex(p => p.projectName === projectName);
            
            if (existingIndex >= 0) {
                reportData.id = projects[existingIndex].id;
                reportData.createdAt = projects[existingIndex].createdAt;
                projects[existingIndex] = reportData;
            } else {
                projects.push(reportData);
            }

            localStorage.setItem(STORAGE_KEYS.PROJECTS, JSON.stringify(projects));
            showAlert('리포트가 저장되었습니다!', 'success');
            updateProjectSelect();
        }

        // 리포트 미리보기 생성
        function generateReport() {
            const projectName = document.getElementById('projectName').value;
            const cpu = document.getElementById('cpu').value;
            const ram = document.getElementById('ram').value;
            const region = document.getElementById('region').value;
            const stage = document.getElementById('stage').value;

            let html = '<div class="report-section">';
            html += '<h3>📋 프로젝트 개요</h3>';
            html += '<div class="info-row">';
            html += `<div class="info-item"><label>프로젝트 이름</label><div class="value">${projectName}</div></div>`;
            html += `<div class="info-item"><label>CPU</label><div class="value">${cpu}</div></div>`;
            html += `<div class="info-item"><label>RAM</label><div class="value">${ram}</div></div>`;
            html += `<div class="info-item"><label>출시지역</label><div class="value">${region}</div></div>`;
            html += `<div class="info-item"><label>일정 단계</label><div class="value">${stage}단계</div></div>`;
            html += '</div></div>';

            if (currentIssueData) {
                html += '<div class="report-section">';
                html += '<h3>🔍 제품 이슈 현황</h3>';
                html += document.getElementById('issueAnalysisResult').innerHTML;
                html += '</div>';
            }

            document.getElementById('reportPreview').innerHTML = html;
        }

        // 프로젝트 선택 드롭다운 업데이트
        function updateProjectSelect() {
            const projects = getProjects();
            const select = document.getElementById('projectSelect');
            
            select.innerHTML = '<option value="">새 프로젝트 생성</option>';
            projects.forEach(project => {
                const option = document.createElement('option');
                option.value = project.id;
                option.textContent = project.projectName;
                select.appendChild(option);
            });
        }

        // 프로젝트 데이터 로드
        function loadProjectData() {
            const projectId = document.getElementById('projectSelect').value;
            if (!projectId) return;

            const projects = getProjects();
            const project = projects.find(p => p.id == projectId);
            
            if (project) {
                document.getElementById('projectName').value = project.projectName;
                document.getElementById('cpu').value = project.cpu || '';
                document.getElementById('ram').value = project.ram || '';
                document.getElementById('region').value = project.region || '';
                document.getElementById('stage').value = project.stage || '1';
                
                if (project.issueData) {
                    currentIssueData = project.issueData;
                    analyzeIssues(project.issueData);
                }
            }
        }

        // 프로젝트 목록 로드
        function loadProjects() {
            const projects = getProjects();
            const projectList = document.getElementById('projectList');
            
            if (projects.length === 0) {
                projectList.innerHTML = '<p style="text-align: center; color: #6c757d;">저장된 프로젝트가 없습니다.</p>';
                return;
            }

            let html = '';
            projects.forEach(project => {
                const date = new Date(project.updatedAt).toLocaleDateString('ko-KR');
                html += `
                    <div class="project-card" onclick="viewProject(${project.id})">
                        <h3>${project.projectName}</h3>
                        <p>CPU: ${project.cpu || '-'}</p>
                        <p>RAM: ${project.ram || '-'}</p>
                        <p>단계: ${project.stage}단계</p>
                        <p style="margin-top: 10px; font-size: 0.8em;">최종 수정: ${date}</p>
                    </div>
                `;
            });
            projectList.innerHTML = html;
        }

        // 프로젝트 상세보기
        function viewProject(projectId) {
            const projects = getProjects();
            const project = projects.find(p => p.id === projectId);
            
            if (!project) return;

            document.getElementById('projectSelect').value = projectId;
            loadProjectData();
            showTab('report');
            document.querySelector('.nav-tab').classList.add('active');
        }

        // 챗봇 모달 표시
        function showChatbotModal() {
            document.getElementById('chatbotModal').style.display = 'flex';
            document.getElementById('chatbotName').value = '';
            document.getElementById('chatbotUrl').value = '';
        }

        // 챗봇 모달 닫기
        function closeChatbotModal() {
            document.getElementById('chatbotModal').style.display = 'none';
        }

        // 챗봇 저장
        function saveChatbot() {
            const name = document.getElementById('chatbotName').value.trim();
            const url = document.getElementById('chatbotUrl').value.trim();

            if (!name || !url) {
                showAlert('챗봇 이름과 URL을 모두 입력해주세요.', 'danger');
                return;
            }

            const chatbots = getChatbots();
            chatbots.push({ id: Date.now(), name, url });
            
            localStorage.setItem(STORAGE_KEYS.CHATBOTS, JSON.stringify(chatbots));
            
            showAlert('챗봇이 저장되었습니다!', 'success');
            closeChatbotModal();
            loadChatbots();
        }

        // 챗봇 목록 로드
        function loadChatbots() {
            const chatbots = getChatbots();
            const chatbotList = document.getElementById('chatbotList');
            
            if (chatbots.length === 0) {
                chatbotList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <p>등록된 챗봇이 없습니다.</p>
                        <p style="font-size: 0.9em;">우측 상단의 + 버튼을 눌러 챗봇을 추가하세요.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            chatbots.forEach(chatbot => {
                html += `
                    <a href="${chatbot.url}" target="_blank" class="tile chatbot-tile">
                        <h4>💬 ${chatbot.name}</h4>
                        <p style="word-break: break-all;">${chatbot.url}</p>
                    </a>
                `;
            });
            chatbotList.innerHTML = html;
        }

        // Task 모달 표시
        function showTaskModal(taskId = null) {
            document.getElementById('taskModal').style.display = 'flex';
            
            if (taskId) {
                // 수정 모드
                const tasks = getTasks();
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('taskModalTitle').textContent = '✅ Task 수정';
                    document.getElementById('taskTitle').value = task.title;
                    document.getElementById('taskAssignee').value = task.assignee || '';
                    document.getElementById('taskDueDate').value = task.dueDate || '';
                    document.getElementById('taskStatus').value = task.status;
                    document.getElementById('taskProgress').value = task.progress || 0;
                    document.getElementById('taskId').value = taskId;
                }
            } else {
                // 추가 모드
                document.getElementById('taskModalTitle').textContent = '✅ Task 추가';
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskAssignee').value = '';
                document.getElementById('taskDueDate').value = '';
                document.getElementById('taskStatus').value = 'ongoing';
                document.getElementById('taskProgress').value = 0;
                document.getElementById('taskId').value = '';
            }
        }

        // Task 모달 닫기
        function closeTaskModal() {
            document.getElementById('taskModal').style.display = 'none';
        }

        // Task 필터 토글
        function toggleTaskFilter() {
            const filterGroup = document.getElementById('taskFilterGroup');
            filterGroup.style.display = filterGroup.style.display === 'none' ? 'flex' : 'none';
        }

        // Task 필터링
        let currentFilter = 'all';
        function filterTasks(filter) {
            currentFilter = filter;
            
            // 필터 버튼 활성화 상태 업데이트
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadTasks();
        }

        // Task 저장
        function saveTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const assignee = document.getElementById('taskAssignee').value.trim();
            const dueDate = document.getElementById('taskDueDate').value;
            const status = document.getElementById('taskStatus').value;
            const progress = parseInt(document.getElementById('taskProgress').value) || 0;
            const taskId = document.getElementById('taskId').value;

            if (!title) {
                showAlert('Task 제목을 입력해주세요.', 'danger');
                return;
            }

            const tasks = getTasks();
            
            if (taskId) {
                // 수정
                const index = tasks.findIndex(t => t.id == taskId);
                if (index >= 0) {
                    tasks[index] = {
                        ...tasks[index],
                        title,
                        assignee,
                        dueDate,
                        status,
                        progress,
                        updatedAt: new Date().toISOString()
                    };
                }
            } else {
                // 추가
                tasks.push({
                    id: Date.now(),
                    title,
                    assignee,
                    dueDate,
                    status,
                    progress,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
            }

            localStorage.setItem(STORAGE_KEYS.TASKS, JSON.stringify(tasks));
            
            showAlert('Task가 저장되었습니다!', 'success');
            closeTaskModal();
            loadTasks();
        }

        // Task 목록 로드
        function loadTasks() {
            let tasks = getTasks();
            
            // 필터 적용
            if (currentFilter !== 'all') {
                tasks = tasks.filter(t => t.status === currentFilter);
            }
            
            // 진행중/보류와 완료로 구분
            const ongoingTasks = tasks.filter(t => t.status !== 'complete');
            const completedTasks = tasks.filter(t => t.status === 'complete');
            
            const ongoingList = document.getElementById('taskListOngoing');
            const completeList = document.getElementById('taskListComplete');
            const completedSection = document.getElementById('completedSection');
            
            // 진행중/보류 Task 표시
            if (ongoingTasks.length === 0 && currentFilter === 'all') {
                ongoingList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <p>등록된 Task가 없습니다.</p>
                        <p style="font-size: 0.9em;">우측 상단의 + 버튼을 눌러 Task를 추가하세요.</p>
                    </div>
                `;
            } else if (ongoingTasks.length === 0) {
                ongoingList.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 40px;">해당하는 Task가 없습니다.</p>';
            } else {
                ongoingList.innerHTML = '<div class="tile-grid">' + ongoingTasks.map(task => createTaskTile(task)).join('') + '</div>';
            }
            
            // 완료된 Task 표시
            if (completedTasks.length > 0 && currentFilter === 'all') {
                completedSection.style.display = 'block';
                completeList.innerHTML = '<div class="tile-grid">' + completedTasks.map(task => createTaskTile(task)).join('') + '</div>';
            } else {
                completedSection.style.display = 'none';
                completeList.innerHTML = '';
            }
        }

        // Task 타일 생성
        function createTaskTile(task) {
            const statusText = {
                'ongoing': '진행중',
                'complete': '완료',
                'hold': '보류'
            };
            
            const dueDate = task.dueDate ? new Date(task.dueDate).toLocaleDateString('ko-KR') : '-';
            const progress = task.progress || 0;
            
            return `
                <div class="tile task-tile" onclick="showTaskModal(${task.id})">
                    <span class="task-status status-${task.status}">${statusText[task.status]}</span>
                    <h4>${task.title}</h4>
                    <p><strong>담당자:</strong> ${task.assignee || '-'}</p>
                    <p><strong>목표일:</strong> ${dueDate}</p>
                    <p><strong>진행상황:</strong> ${progress}%</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                </div>
            `;
        }

        // Task 삭제 (추후 필요시 사용)
        function deleteTask(taskId) {
            if (!confirm('이 Task를 삭제하시겠습니까?')) return;
            
            const tasks = getTasks();
            const filtered = tasks.filter(t => t.id !== taskId);
            localStorage.setItem(STORAGE_KEYS.TASKS, JSON.stringify(filtered));
            
            showAlert('Task가 삭제되었습니다.', 'success');
            loadTasks();
        }

        // 로컬 스토리지 헬퍼 함수들
        function getProjects() {
            const data = localStorage.getItem(STORAGE_KEYS.PROJECTS);
            return data ? JSON.parse(data) : [];
        }

        function getChatbots() {
            const data = localStorage.getItem(STORAGE_KEYS.CHATBOTS);
            return data ? JSON.parse(data) : [];
        }

        function getTasks() {
            const data = localStorage.getItem(STORAGE_KEYS.TASKS);
            return data ? JSON.parse(data) : [];
        }

        // 알림 표시
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(alertDiv, content.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
